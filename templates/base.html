<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Visa Assistant Pro{% endblock %}</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="bg-gradient"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">
                <i class="fas fa-passport"></i>
            </div>
            <div class="loading-text">Visa Assistant Pro</div>
            <div class="loading-bar">
                <div class="loading-fill"></div>
            </div>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-passport"></i>
                <span class="logo-text">Visa Pro</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="{{ url_for('home') }}" class="nav-link" data-page="home">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('application') }}" class="nav-link" data-page="application">
                    <i class="fas fa-file-alt"></i>
                    <span class="nav-text">Application</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('chat') }}" class="nav-link" data-page="chat">
                    <i class="fas fa-comments"></i>
                    <span class="nav-text">AI Assistant</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('documents') }}" class="nav-link" data-page="documents">
                    <i class="fas fa-folder-open"></i>
                    <span class="nav-text">Documents</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('help_page') }}" class="nav-link" data-page="help">
                    <i class="fas fa-question-circle"></i>
                    <span class="nav-text">Help & FAQ</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <div class="user-name">Visa Applicant</div>
                    <div class="user-status">Online</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    {% block page_title %}Dashboard{% endblock %}
                </div>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="header-actions">
                    <button class="action-btn notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </button>
                    <button class="action-btn settings-btn">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>

        <!-- Floating Action Button -->
        <div class="fab-container">
            <button class="fab" id="fabMain">
                <i class="fas fa-plus"></i>
            </button>
            <div class="fab-menu" id="fabMenu">
                <button class="fab-item" data-action="new-application">
                    <i class="fas fa-file-plus"></i>
                    <span class="fab-label">New Application</span>
                </button>
                <button class="fab-item" data-action="upload-document">
                    <i class="fas fa-upload"></i>
                    <span class="fab-label">Upload Document</span>
                </button>
                <button class="fab-item" data-action="ask-ai">
                    <i class="fas fa-robot"></i>
                    <span class="fab-label">Ask AI</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <!-- Modal content will be dynamically inserted here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
    
    {% block extra_js %}{% endblock %}

    <script>
        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });
    </script>
</body>
</html>
